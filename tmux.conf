# ============================================================================
# TMUX CONFIG - Pi Workflow + Catppuccin Mocha Theme
# Prefix: Ctrl+b (default)
# ============================================================================

# Mouse support
set -g mouse on

# Start windows at 1
set -g base-index 1
setw -g pane-base-index 1

# Renumber windows
set -g renumber-windows on

# More scrollback
set -g history-limit 50000

# Faster escape for terminal editor flows
set -s escape-time 0

# Focus events for file autoreload-aware tools
set -g focus-events on

# Longer status messages
set -g display-time 4000

# Keep tmux window names stable and use them as the terminal title.
set -g automatic-rename off
set -g allow-rename off
set -g set-titles on
set -g set-titles-string "#W"

# Better window sizing for multiple monitors (window option)
setw -g aggressive-resize on

# OSC 52 clipboard support (works through SSH)
set -g set-clipboard on

# True colors
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# Vi-style copy mode
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "$HOME/.local/bin/tmux-clipboard.sh"

# Extended keys - enables Shift+Enter, Ctrl+Shift+*, etc.
set -g extended-keys on
set -g extended-keys-format csi-u
set -as terminal-features ',*:extkeys'
set -s user-keys[0] "\e[13;2u"
bind -n User0 send-keys -l "\e[13;2u"

# xterm-style function key sequences
set -gw xterm-keys on

# ============================================================================
# FAST NAVIGATION (agent workflow)
# ============================================================================

# Use prefix+1..9 for tmux windows and prefix+h/j/k/l for panes

# ============================================================================
# NOTIFICATIONS (when activity happens in another window)
# ============================================================================

setw -g monitor-activity on
set -g visual-activity off
set -g monitor-bell on
set -g bell-action other

# ============================================================================
# THEME — Catppuccin Mocha (vendored, sans plugin)
# Palette inline (@thm_*) : plus besoin de charger catppuccin/tmux via TPM.
# Démarrage serveur ~500 ms → ~20 ms ; rendu strictement identique.
# ============================================================================
set -g @thm_rosewater "#f5e0dc"
set -g @thm_flamingo "#f2cdcd"
set -g @thm_pink "#f5c2e7"
set -g @thm_mauve "#cba6f7"
set -g @thm_red "#f38ba8"
set -g @thm_maroon "#eba0ac"
set -g @thm_peach "#fab387"
set -g @thm_yellow "#f9e2af"
set -g @thm_green "#a6e3a1"
set -g @thm_teal "#94e2d5"
set -g @thm_sky "#89dceb"
set -g @thm_sapphire "#74c7ec"
set -g @thm_blue "#89b4fa"
set -g @thm_lavender "#b4befe"
set -g @thm_fg "#cdd6f4"
set -g @thm_subtext_1 "#a6adc8"
set -g @thm_subtext_0 "#bac2de"
set -g @thm_overlay_2 "#9399b2"
set -g @thm_overlay_1 "#7f849c"
set -g @thm_overlay_0 "#6c7086"
set -g @thm_surface_2 "#585b70"
set -g @thm_surface_1 "#45475a"
set -g @thm_surface_0 "#313244"
set -g @thm_bg "#1e1e2e"
set -g @thm_mantle "#181825"
set -g @thm_crust "#11111b"

# Pane borders - subtle (mauve local, sky on Mac Mini override below)
set -g pane-border-style "fg=#{@thm_surface_0}"
set -g pane-active-border-style "fg=#{@thm_mauve}"

# Window status (basic pill style + peach dot on activity/bell)
set -g window-status-separator ""
set -g window-status-activity-style "default"
set -g window-status-bell-style "default"
set -g window-status-format "#[fg=#{@thm_crust},bg=#{@thm_overlay_2}] #I #[fg=#{@thm_fg},bg=#{@thm_surface_0}]  #W  #{?#{||:#{window_activity_flag},#{window_bell_flag}}, #[fg=#{@thm_peach}]●,} "
set -g window-status-current-format "#[fg=#{@thm_crust},bg=#{@thm_mauve}] #I #[fg=#{@thm_fg},bg=#{@thm_surface_1}]  #W  #{?#{||:#{window_activity_flag},#{window_bell_flag}}, #[fg=#{@thm_peach}]●,} "

# Nested / remote host (Mac Mini): sky accent so SSH-in-tmux is visually
# distinct from the local mauve session. Format match (-F) : reliable at
# config-load time, no shell subprocess.
if-shell -F '#{m:mac-mini*,#{host_short}}' {
  set -g pane-active-border-style "fg=#{@thm_sky}"
  set -g window-status-current-format "#[fg=#{@thm_crust},bg=#{@thm_sky}] #I #[fg=#{@thm_fg},bg=#{@thm_surface_1}]  #W  #{?#{||:#{window_activity_flag},#{window_bell_flag}}, #[fg=#{@thm_peach}]●,} "
}

# ============================================================================
# STATUS BAR
# ============================================================================

set -g status-position top
set -g status on
set -g status-style "bg=#{@thm_mantle},fg=#{@thm_fg}"
set -g status-justify left
set -g status-left-length 100
set -g status-right-length 200
set -g status-interval 30

# Left status: empty (windows are shown by the window-status format)
set -g status-left ""

# Local (default): mauve session pill — same look as before
set -g status-right "#[fg=#{@thm_surface_0}]▓▒░  #[fg=#{@thm_peach},bg=#{@thm_surface_0}] %H:%M #[bg=default]  #[fg=#{@thm_mauve}]█ #[fg=#{@thm_crust},bg=#{@thm_mauve}]   #S   "

# Mac Mini: same Catppuccin layout, sky accent + "mini" label (no clock —
# nested under local tmux which already shows time).
if-shell -F '#{m:mac-mini*,#{host_short}}' {
  set -g status-position bottom
  set -g status-right "#[fg=#{@thm_sky}]█ #[fg=#{@thm_crust},bg=#{@thm_sky}]  mini · #S  "
}

# ============================================================================
# KEYBINDINGS
# ============================================================================

# Split panes with | and - (in current path)
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Navigate panes with h/j/k/l (prefix + hjkl)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Resize panes
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# New window in current path
bind c new-window -c "#{pane_current_path}"

# Synchronize panes (plan/review workflow)
bind S setw synchronize-panes

# Zoom/unzoom pane
bind z resize-pane -Z

# Reload config
bind r source-file ~/.tmux.conf \; display "Config reloaded!"

# Session/window picker (useful with many worktrees)
bind w choose-tree -Zw
bind s choose-tree -Zs

# Quick session switching (last session)
bind Space switch-client -l

# Kill pane without confirmation
bind x kill-pane
