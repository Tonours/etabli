# ============================================================================
# TMUX CONFIG - Pi Workflow + Catppuccin Mocha Theme
# Prefix: Ctrl+b (default)
# ============================================================================

# Mouse support
set -g mouse on

# Start windows at 1
set -g base-index 1
setw -g pane-base-index 1

# Renumber windows
set -g renumber-windows on

# More scrollback
set -g history-limit 50000

# Faster escape for terminal editor flows
set -s escape-time 0

# Focus events for file autoreload-aware tools
set -g focus-events on

# Longer status messages
set -g display-time 4000

# Keep tmux window names stable and use them as the terminal title.
set -g automatic-rename off
set -g allow-rename off
set -g set-titles on
set -g set-titles-string "#W"

# Better window sizing for multiple monitors
set -g aggressive-resize on

# OSC 52 clipboard support (works through SSH)
set -g set-clipboard on

# True colors
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# Vi-style copy mode
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "$HOME/.local/bin/tmux-clipboard.sh"

# Extended keys - enables Shift+Enter, Ctrl+Shift+*, etc.
set -g extended-keys on
set -g extended-keys-format csi-u
set -as terminal-features ',*:extkeys'
set -s user-keys[0] "\e[13;2u"
bind -n User0 send-keys -l "\e[13;2u"

# xterm-style function key sequences
set -gw xterm-keys on

# ============================================================================
# FAST NAVIGATION (agent workflow)
# ============================================================================

# Use prefix+1..9 for tmux windows and prefix+h/j/k/l for panes

# ============================================================================
# NOTIFICATIONS (when activity happens in another window)
# ============================================================================

setw -g monitor-activity on
set -g visual-activity off
set -g monitor-bell on
set -g bell-action other

# ============================================================================
# PLUGINS
# ============================================================================

# TPM - Plugin Manager
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'

# Catppuccin Theme
set -g @plugin 'catppuccin/tmux'
set -g @catppuccin_flavor 'mocha'

# Disable Catppuccin status-right (we use our own)
set -g @catppuccin_status_modules_right ""

# ============================================================================
# CATPPUCCIN CUSTOMIZATION
# ============================================================================

# Window status style (pixel art blocks)
set -g @catppuccin_window_status_style "basic"

# Window format with padding and number
set -g @catppuccin_window_text "  #W  "
set -g @catppuccin_window_default_text "  #W  "
set -g @catppuccin_window_current_text "  #W  "

# Show an orange dot on tabs that have pending activity or bell notifications.
set -g @catppuccin_window_flags "icon"
set -g @catppuccin_window_flags_icon_activity " #[fg=#{@thm_peach}]●"
set -g @catppuccin_window_flags_icon_bell " #[fg=#{@thm_peach}]●"
set -g @catppuccin_window_flags_icon_format "##{?##{||:##{window_activity_flag},##{window_bell_flag}}, #[fg=#{@thm_peach}]●,}"
set -g @catppuccin_window_flags_icon_current ""
set -g @catppuccin_window_flags_icon_last ""
set -g @catppuccin_window_flags_icon_mark ""
set -g @catppuccin_window_flags_icon_silent ""
set -g @catppuccin_window_flags_icon_zoom ""

# Window colors - current window uses mauve accent (local default)
set -g @catppuccin_window_number_color "#{@thm_overlay_2}"
set -g @catppuccin_window_text_color "#{@thm_surface_0}"
set -g @catppuccin_window_current_background "#{@thm_mauve}"
set -g @catppuccin_window_current_color "#{@thm_crust}"
set -g @catppuccin_window_current_number_color "#{@thm_mauve}"
set -g @catppuccin_window_current_text_color "#{@thm_surface_1}"

# Pane borders - subtle
set -g @catppuccin_pane_border_style "fg=#{@thm_surface_0}"
set -g @catppuccin_pane_active_border_style "fg=#{@thm_mauve}"

# Nested / remote host (Mac Mini): same Catppuccin Mocha, sky accent so
# SSH-in-tmux is visually distinct from the local mauve session.
# Use format match (-F + host_short): reliable at config-load time.
if-shell -F '#{m:mac-mini*,#{host_short}}' {
  set -g @catppuccin_window_current_background "#{@thm_sky}"
  set -g @catppuccin_window_current_color "#{@thm_crust}"
  set -g @catppuccin_window_current_number_color "#{@thm_sky}"
  set -g @catppuccin_window_current_text_color "#{@thm_surface_1}"
  set -g @catppuccin_pane_active_border_style "fg=#{@thm_sky}"
}

# ============================================================================
# STATUS BAR
# ============================================================================

set -g status-position top
set -g status on
set -g status-style "bg=#{@thm_crust},fg=#{@thm_text}"
set -g status-justify left
set -g status-left-length 100
set -g status-right-length 200
set -g status-interval 30
set -g window-status-separator ""

# Left status: empty (windows are shown by catppuccin)
set -g status-left ""

# ============================================================================
# KEYBINDINGS
# ============================================================================

# Split panes with | and - (in current path)
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Navigate panes with h/j/k/l (prefix + hjkl)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Resize panes
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# New window in current path
bind c new-window -c "#{pane_current_path}"

# Synchronize panes (plan/review workflow)
bind S setw synchronize-panes

# Zoom/unzoom pane
bind z resize-pane -Z

# Reload config
bind r source-file ~/.tmux.conf \; display "Config reloaded!"

# Session/window picker (useful with many worktrees)
bind w choose-tree -Zw
bind s choose-tree -Zs

# Quick session switching (last session)
bind Space switch-client -l

# Kill pane without confirmation
bind x kill-pane

# ============================================================================
# Initialize TPM
# ============================================================================
run '~/.tmux/plugins/tpm/tpm'

# ============================================================================
# POST-PLUGIN CONFIG (must be after TPM to override Catppuccin)
# ============================================================================
set -g window-status-activity-style "default"
set -g window-status-bell-style "default"

# Local (default): mauve session pill — same look as before
set -g status-right "#[fg=#{@thm_surface_0}]▓▒░  #[fg=#{@thm_peach},bg=#{@thm_surface_0}] %H:%M #[bg=default]  #[fg=#{@thm_mauve}]█ #[fg=#{@thm_crust},bg=#{@thm_mauve}]   #S   "

# Mac Mini: same Catppuccin layout, sky accent + "mini" label.
# Status at bottom so nested SSH shows: local bar on top, mini bar at bottom.
if-shell -F '#{m:mac-mini*,#{host_short}}' {
  set -g status-position bottom
  set -g status-right "#[fg=#{@thm_surface_0}]▓▒░  #[fg=#{@thm_peach},bg=#{@thm_surface_0}] %H:%M #[bg=default]  #[fg=#{@thm_sky}]█ #[fg=#{@thm_crust},bg=#{@thm_sky}]  mini · #S  "
}
