name: agentic-infra

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  verify-shell-and-docs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Bash syntax check
        run: |
          while IFS= read -r -d '' file; do
            if head -n 1 "$file" | grep -Eq '^#!.*\b(bash|sh)\b'; then
              bash -n "$file"
            fi
          done < <(find scripts -maxdepth 1 -type f -print0)

      - name: Validate JSON config files
        run: |
          jq empty pi/settings.json
          jq empty pi/agent/settings.json
          jq empty pi/models.json

      - name: Run script tests
        run: |
          bash tests/codex-organization-smoke.sh
          bash tests/workflow-docs-smoke.sh
          bash tests/harness-smoke.sh

  verify-pi-typescript:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Configure git
        run: |
          git config --global user.email "ci@example.com"
          git config --global user.name "CI"

      - name: Bootstrap local Pi agent settings
        run: |
          mkdir -p ~/.pi/agent
          cp pi/agent/settings.json ~/.pi/agent/settings.json

      - name: Install Pi test dependencies
        run: |
          cd pi
          bun install --frozen-lockfile

      - name: Run Pi TypeScript test suite
        run: |
          cd pi
          bun test ./extensions/__tests__/*.test.ts

      - name: Verify skill lock
        run: |
          cd pi
          bun run verify:skills

      - name: Run Pi extension import smoke
        run: |
          cd pi
          bun -e 'for (const path of [
            "./extensions/block-google-providers.ts",
            "./extensions/filter-output.ts",
            "./extensions/rtk.ts",
          ]) await import(path)'

  verify-neovim-smoke:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Neovim
        uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: v0.12.2

      - name: Configure git
        run: |
          git config --global user.email "ci@example.com"
          git config --global user.name "CI"

      - name: Run local OPS and Neovim smoke suite
        run: |
          bash tests/fix-links-smoke.sh
          bash tests/install-smoke.sh
          bash tests/nvim-smoke.sh
