name: agentic-infra

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  verify-shell-and-docs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Canonical shell/docs parity group
        run: scripts/verify-agentic-infra shell-docs

  verify-pi-typescript:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Cache bun install
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('pi/bun.lock*') }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Configure git
        run: |
          git config --global user.email "ci@example.com"
          git config --global user.name "CI"

      - name: Bootstrap local Pi agent settings
        run: |
          mkdir -p ~/.pi/agent
          cp pi/agent/settings.json ~/.pi/agent/settings.json

      - name: Install Pi test dependencies
        run: |
          cd pi
          bun install --frozen-lockfile

      - name: Canonical Pi parity group
        run: scripts/verify-agentic-infra pi

  verify-neovim-smoke:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Setup Neovim
        uses: rhysd/action-setup-vim@febef33995d6649302e9d88dda81e071b68f16a7 # v1.6.1
        with:
          neovim: true
          version: v0.12.2

      - name: Cache npm global
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.npm
          key: npm-global-hunkdiff-${{ runner.os }}

      - name: Install Hunk CLI
        run: npm install --global hunkdiff@0.17.3

      - name: Configure git
        run: |
          git config --global user.email "ci@example.com"
          git config --global user.name "CI"

      - name: Canonical Neovim parity group
        run: scripts/verify-agentic-infra nvim
