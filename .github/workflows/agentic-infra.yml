name: agentic-infra

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify-shell-and-docs:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          curl -fsSLo "$RUNNER_TEMP/gitleaks_8.30.1_linux_x64.tar.gz" \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          cd "$RUNNER_TEMP"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks_8.30.1_linux_x64.tar.gz" | sha256sum -c -
          mkdir -p gitleaks-bin
          tar -xzf gitleaks_8.30.1_linux_x64.tar.gz -C gitleaks-bin gitleaks
          echo "$RUNNER_TEMP/gitleaks-bin" >>"$GITHUB_PATH"

      - name: Secret scan of the full history
        run: gitleaks git --no-banner --redact --log-opts="--all --full-history --diff-merges=first-parent" .

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Install skill checker dependencies
        working-directory: pi
        run: bun install --frozen-lockfile

      - name: Canonical shell/docs parity group
        env:
          AGENTIC_INFRA_JOBS: "2"
        run: scripts/verify-agentic-infra shell-docs

  verify-pi-typescript:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Cache bun install
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('pi/bun.lock*') }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Configure git
        run: |
          git config --global user.email "ci@example.com"
          git config --global user.name "CI"

      - name: Bootstrap local Pi agent settings
        run: |
          mkdir -p ~/.pi/agent
          cp pi/agent/settings.json ~/.pi/agent/settings.json

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.22.0"

      - name: Install Pi test dependencies
        run: |
          cd pi
          bun install --frozen-lockfile

      - name: Canonical Pi parity group
        run: scripts/verify-agentic-infra pi
