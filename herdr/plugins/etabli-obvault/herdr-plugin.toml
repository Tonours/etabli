id = "etabli.obvault"
name = "Etabli Obvault"
version = "0.1.0"
min_herdr_version = "0.8.0"
description = "Bounded obvault packs + worktree helpers for the etabli harness"
platforms = ["macos", "linux"]

[[actions]]
id = "obvault-session"
title = "Obvault session pack"
contexts = ["workspace", "pane"]
command = ["bash", "scripts/obvault-session.sh"]

[[actions]]
id = "obvault-status"
title = "Obvault status"
contexts = ["workspace"]
command = ["bash", "scripts/obvault-status.sh"]

[[actions]]
id = "worktree-hint"
title = "Worktree isolation reminder"
contexts = ["workspace"]
command = ["bash", "scripts/worktree-hint.sh"]
