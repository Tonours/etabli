# Herdr — aligned with etabli stack (Catppuccin Mocha + mauve accent)
# Ghostty / nvim / tmux: base #1e1e2e · text #cdd6f4 · mauve #cba6f7
# Workflow: multi-agent (claude, codex, grok, opencode, pi) + git worktrees sous ~/work
# Docs: herdr --default-config · https://herdr.dev/docs/configuration/

onboarding = false

[theme]
name = "catppuccin"
# Ghostty is always dark Mocha — keep manual dark (no auto light switch).
auto_switch = false
dark_name = "catppuccin"
light_name = "catppuccin-latte"

# Pin exact Mocha tokens (same hex as etabli nvim palette + Ghostty).
# panel_bg = reset → chrome UI blends into Ghostty base instead of a second bg.
[theme.custom]
panel_bg = "reset"
accent = "#cba6f7"
mauve = "#cba6f7"
text = "#cdd6f4"
subtext0 = "#a6adc8"
surface0 = "#313244"
surface1 = "#45475a"
surface_dim = "#181825"
overlay0 = "#6c7086"
overlay1 = "#7f849c"
green = "#a6e3a1"
yellow = "#f9e2af"
red = "#f38ba8"
blue = "#89b4fa"
teal = "#94e2d5"
peach = "#fab387"

[terminal]
default_shell = "/bin/zsh"
# Login shells pick up Homebrew / asdf / ~/.zshrc PATH (grok, opencode, claude).
shell_mode = "login"
# New panes/tabs inherit the source pane cwd (agent splits stay in-project).
new_cwd = "follow"
kitty_graphics = false

[update]
channel = "stable"
version_check = true
manifest_check = true

[keys]
# Same prefix as tmux muscle memory (ctrl+b).
prefix = "ctrl+b"

# Workspace / agent navigation — multi-agent herd
previous_workspace = "prefix+["
next_workspace = "prefix+]"
previous_agent = "prefix+{"
next_agent = "prefix+}"
focus_agent = "prefix+alt+1..9"
switch_workspace = "prefix+shift+1..9"
last_pane = "prefix+semicolon"

# Worktrees (etabli-style parallel checkouts under ~/work/worktrees)
new_worktree = "prefix+shift+g"
open_worktree = "prefix+shift+o"
remove_worktree = "prefix+shift+backspace"

# Keep useful defaults explicit (docs / muscle memory)
help = "prefix+?"
settings = "prefix+s"
detach = "prefix+q"
reload_config = "prefix+shift+r"
workspace_picker = "prefix+w"
goto = "prefix+g"
new_workspace = "prefix+shift+n"
rename_workspace = "prefix+shift+w"
close_workspace = "prefix+shift+d"
new_tab = "prefix+c"
rename_tab = "prefix+shift+t"
previous_tab = "prefix+p"
next_tab = "prefix+n"
switch_tab = "prefix+1..9"
close_tab = "prefix+shift+x"
rename_pane = "prefix+shift+p"
edit_scrollback = "prefix+e"
focus_pane_left = "prefix+h"
focus_pane_down = "prefix+j"
focus_pane_up = "prefix+k"
focus_pane_right = "prefix+l"
cycle_pane_next = "prefix+tab"
cycle_pane_previous = "prefix+shift+tab"
split_vertical = "prefix+v"
split_horizontal = "prefix+minus"
close_pane = "prefix+x"
zoom = "prefix+z"
resize_mode = "prefix+r"
toggle_sidebar = "prefix+b"

# ── Custom commands (prefix+alt) ──────────────────────────────────────────
# lazygit popup — same habit as many agent workflows
[[keys.command]]
key = "prefix+alt+g"
type = "popup"
command = "lazygit"
description = "lazygit"
width = "90%"
height = "90%"

# Scratch interactive shell without splitting layout
[[keys.command]]
key = "prefix+alt+t"
type = "popup"
command = "exec /bin/zsh -l"
description = "scratch shell"
width = "80%"
height = "80%"

# Quick nvim in cwd (notes / PLAN.md / quick edits)
[[keys.command]]
key = "prefix+alt+e"
type = "popup"
command = "exec nvim"
description = "nvim"
width = "90%"
height = "90%"

# gh dashboard for PR/CI babysitting
[[keys.command]]
key = "prefix+alt+p"
type = "popup"
command = "gh pr status; echo; gh run list --limit 8; echo; echo '[enter to close]'; read"
description = "gh pr/ci status"
width = "80%"
height = "70%"

# PR id/url -> git worktree on that PR + claude session (gist: nbouliol/7281722)
# alt+r is taken by reviewr; /code-review-inline does not exist here -> /pr-review
[[keys.command]]
key = "prefix+alt+w"
type = "popup"
command = "\"$(python3 -c 'from pathlib import Path; print((Path.home() / \".config/herdr/config.toml\").resolve().parent / \"scripts/review-pr.sh\")')\" '/pr-review {pr}'"
description = "review PR in worktree"
width = "60%"
height = "30%"

[[keys.command]]
key = "prefix+alt+q"
type = "popup"
command = "\"$(python3 -c 'from pathlib import Path; print((Path.home() / \".config/herdr/config.toml\").resolve().parent / \"scripts/review-pr.sh\")')\" '/pr-qa {pr}'"
description = "QA plan for PR in worktree"
width = "60%"
height = "30%"

# ── Plugin actions (community + etabli) ───────────────────────────────────
[[keys.command]]
key = "prefix+f"
type = "plugin_action"
command = "sessionizer.open"
description = "sessionizer projects"

[[keys.command]]
key = "prefix+up"
type = "plugin_action"
command = "sessionizer.worktree-open"
description = "sessionizer worktrees"

[[keys.command]]
key = "prefix+alt+r"
type = "plugin_action"
command = "persiyanov.reviewr.toggle"
description = "reviewr toggle"

[[keys.command]]
key = "prefix+alt+v"
type = "plugin_action"
command = "herdr-file-viewer.open-file-viewer"
description = "file viewer"

[[keys.command]]
key = "prefix+alt+m"
type = "plugin_action"
command = "nicosuave.memex.toggle"
description = "memex transcripts"

[[keys.command]]
key = "prefix+alt+c"
type = "plugin_action"
command = "etabli.claude-relaunch.crons"
description = "claude relaunch crons"

[[keys.command]]
key = "prefix+alt+o"
type = "plugin_action"
command = "etabli.obvault.obvault-session"
description = "obvault session pack"

[worktrees]
# Parallel agent branches next to real repos under ~/work
directory = "~/work/worktrees"

[ui]
sidebar_width = 28
sidebar_min_width = 20
sidebar_max_width = 40
sidebar_start_collapsed = false
sidebar_collapsed_mode = "compact"
mobile_width_threshold = 64
mouse_capture = true
copy_on_select = true
host_cursor = "native"
redraw_on_focus_gained = true
mouse_scroll_lines = 3
confirm_close = true
# Faster tab creation when juggling agents
prompt_new_tab_name = false
prompt_new_workspace_name = false
pane_borders = true
pane_scrollbars = true
pane_gaps = true
# See which agent owns which pane at a glance
show_agent_labels_on_pane_borders = true
hide_tab_bar_when_single_tab = true
tab_bar_position = "top"
# Attention queue: blocked/done float up across the herd
agent_panel_sort = "priority"
# Mauve accent (matches tmux current-window pill)
accent = "#cba6f7"

# Dense multi-agent sidebar: state + identity + live title
[ui.sidebar.agents]
row_gap = 0
rows = [
  ["state_icon", "machine", "agent", "state_text"],
  ["workspace", "tab"],
  ["terminal_title_stripped"],
]

[ui.sidebar.agents.rows_by_agent]
claude = [
  ["state_icon", "machine", "agent", "state_text"],
  ["terminal_title_stripped"],
  ["workspace", "tab"],
]
codex = [
  ["state_icon", "machine", "agent", "state_text"],
  ["terminal_title_stripped"],
  ["workspace", "tab"],
]
grok = [
  ["state_icon", "machine", "agent", "state_text"],
  ["terminal_title_stripped"],
  ["workspace", "tab"],
]
opencode = [
  ["state_icon", "machine", "agent", "state_text"],
  ["terminal_title_stripped"],
  ["workspace", "tab"],
]
pi = [
  ["state_icon", "machine", "agent", "state_text"],
  ["terminal_title_stripped"],
  ["workspace", "tab"],
]

[ui.sidebar.spaces]
row_gap = 0
rows = [
  ["state_icon", "workspace"],
  ["branch", "git_status"],
]

# OS notifications when a background agent finishes / blocks
[ui.toast]
delivery = "system"
delay_seconds = 3

[ui.toast.herdr]
position = "bottom-right"

[ui.toast.clipboard]
enabled = true
position = "bottom-center"

[ui.sound]
enabled = true

[ui.sound.agents]
# Canonical agent IDs only (opencode uses detection alias; global sound covers it)
claude = "on"
codex = "on"
grok = "on"
pi = "on"
droid = "off"

[session]
# Resume Claude/Codex/etc. conversations after Herdr server restart
resume_agents_on_restore = true

[remote]
manage_ssh_config = true

[experimental]
allow_nested = false
# Do not persist pane screen contents across restarts (privacy)
pane_history = false
# Steady block cursor matches Ghostty cursor-style = block
reveal_hidden_cursor_for_cjk_ime = false
cjk_ime_cursor_shape = "steady_block"

[advanced]
# Generous scrollback for long agent traces / test output
scrollback_limit_bytes = 20000000
