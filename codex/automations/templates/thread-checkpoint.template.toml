version = 1
id = "active-thread-checkpoint"
kind = "cron"
name = "Active thread checkpoint"
prompt = "Produce a concise checkpoint for active Codex threads. Report only; do not modify files, create commits, push, archive threads, rename threads, or run destructive commands.\n\nInspect only local Codex metadata needed to identify recently active, very long, blocked, ambiguous, or likely-to-need-handoff threads. Do not expose raw conversation text, thread IDs, secrets, local absolute paths, credentials, browser data, or unrelated personal data.\n\nOutput a prioritized operational summary: context label, likely status, blocker or risk, and one concrete next action. Separate observed facts from assumptions."
status = "TEMPLATE"
rrule = "RRULE:FREQ=WEEKDAY;BYHOUR=9;BYMINUTE=0;BYSECOND=0"
model = "gpt-5.5"
reasoning_effort = "medium"
execution_environment = "local"
cwds = ["<local-codex-workspace>"]
